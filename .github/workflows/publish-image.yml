name: Publish TCAMT image

on:
  pull_request:
    types: [closed]
    branches:
      - transition

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set image tags
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "pr=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node 13
        uses: actions/setup-node@v4
        with:
          node-version: "13.12.0"

      - name: Frontend build
        working-directory: tcamt-lite-client
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --ignore-scripts
          npx bower install --allow-root
          npx grunt build --prod

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Maven package
        run: mvn clean install -DskipTests -B

      - name: Verify no secrets in WAR
        run: bash scripts/verify-no-secrets.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/prometheuscomputing/tcamt-hid:transition
            ghcr.io/prometheuscomputing/tcamt-hid:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/prometheuscomputing/tcamt-hid:pr-${{ steps.meta.outputs.pr }}
