name: Publish TCAMT image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. 2.1.0-transition.2)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 13
        uses: actions/setup-node@v4
        with:
          node-version: "13.12.0"

      - name: Frontend build
        working-directory: tcamt-lite-client
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          # Karma stack is only for unit tests; omit it so npm install works in CI.
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const name of ['karma-jasmine-jquery', 'karma-phantomjs-launcher', 'karma-chrome-launcher', 'karma-jasmine', 'grunt-karma', 'karma', 'jasmine-core']) {
              delete p.devDependencies[name];
            }
            delete p.scripts.preinstall;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          rm -f package-lock.json
          npm install
          npx bower install --allow-root
          npx grunt build --prod

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Maven package
        run: mvn clean install -DskipTests -B

      - name: Verify no secrets in WAR
        run: bash scripts/verify-no-secrets.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/prometheuscomputing/tcamt-hid:${{ inputs.tag }}
            ghcr.io/prometheuscomputing/tcamt-hid:transition
