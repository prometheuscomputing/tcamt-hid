name: Publish TCAMT image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set image tags from release
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check if frontend rebuild is needed
        id: frontend
        run: |
          if bash scripts/needs-frontend-build.sh; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 13
        if: steps.frontend.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "13.12.0"

      - name: Frontend build
        if: steps.frontend.outputs.needed == 'true'
        working-directory: tcamt-lite-client
        run: |
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci --ignore-scripts
          npx bower install --allow-root
          npx grunt build --prod

      - name: Skip frontend (use committed webapp)
        if: steps.frontend.outputs.needed != 'true'
        run: echo "Using committed tcamt-lite-controller/src/main/webapp/ — backend-only build"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Maven package
        run: mvn clean install -DskipTests -B

      - name: Verify no secrets in WAR
        run: bash scripts/verify-no-secrets.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/prometheuscomputing/tcamt-hid:${{ steps.meta.outputs.tag }}
            ghcr.io/prometheuscomputing/tcamt-hid:${{ steps.meta.outputs.version }}
            ghcr.io/prometheuscomputing/tcamt-hid:latest
