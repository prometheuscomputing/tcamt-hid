<style id="antiClickjack">body{display:none !important;}</style>
<script type="text/javascript">
    if (self === top) {
        var antiClickjack = document.getElementById("antiClickjack");
        antiClickjack.parentNode.removeChild(antiClickjack);
    } else {
        top.location = self.location;
    }
</script>
<div class="container" ng-controller="AccountsListCtrl" ng-init="initManageAccounts()">
    <div class="row">
        <div class="col-md-12">
                <h3>
                    <div msg="" key="manage.author.title"></div>
                </h3>
                <p>

                <div msg="" key="manage.author.message"></div>
                </p>
            <div class="igl-table">
                <table st-table="tmpAccountList" st-safe-src="accountList"
                       class="table table-striped table-bordered table-condensed table-fix-header">
                    <thead>
                    <tr >
                        <th colspan="7" st-ratio="100"><input st-search="" class="form-control" type="text"/></th>
                    </tr>
                    <tr class="tbl-header" style="">
                        <th st-ratio="18">Actions</th>
                        <th st-sort="fullName" st-ratio="15">
                            <div msg key='account.fullName'></div>
                        </th>
                        <th st-sort="email" st-ratio="15">
                            <div msg key='account.email'></div>
                        </th>
                        <th st-sort="username" st-ratio="15">
                            <div msg key='account.username'></div>
                        </th>
                        <th st-sort="employer" st-ratio="15">
                            <div msg key='account.employer'></div>
                        </th>
                        <th st-sort="title" st-ratio="20">
                            <div msg key='account.title'></div>
                        </th>
                        <th st-ratio="15">
                            <div msg key='account.status'></div>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr ng-repeat="row in tmpAccountList track by row.id">
                        <td st-ratio="18" class="text-nowrap">
                            <button type="button" class="btn btn-info btn-xs no-margin" ng-click="editAccount(row)">
                                <i class="fa fa-pencil fa-fw"></i> Edit
                            </button>
                            <button type="button" class="btn btn-success btn-xs no-margin" ng-show="row.pending" ng-click="approveAccount(row)">
                                <i class="fa fa-check fa-fw"></i> Approve
                            </button>
                            <button type="button" class="btn btn-warning btn-xs no-margin" ng-show="!row.pending" ng-click="suspendAccount(row)">
                                <i class="fa fa-times fa-fw"></i> Suspend
                            </button>
                            <button type="button" class="btn btn-danger btn-xs no-margin" ng-click="disableAccount(row)">
                                <i class="fa fa-times fa-fw"></i> Disable
                            </button>
                        </td>
                        <td ng-bind="row.fullName" st-ratio="15"></td>
                        <td ng-bind="row.email" st-ratio="15"></td>
                        <td ng-bind="row.username" st-ratio="15"></td>
                        <!--<td ng-bind="row.phone" st-ratio="10"></td>-->
                        <td ng-bind="row.employer" st-ratio="15"></td>
                        <td ng-bind="row.title" st-ratio="20"></td>
                        <!--<td ng-bind="row.juridiction" st-ratio="10"></td>-->
                        <td st-ratio="15">
                            <span ng-show="!row.pending"><i class="fa fa-check success"></i>&nbsp;Approved</span>
                            <span ng-show="row.pending"><i class="fa fa-times danger"></i>&nbsp;Pending</span>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot ng-show="accountList.length >= 20">
                    <tr style="">
                        <td colspan="7">
                            <div st-pagination="" st-items-by-page="20" st-displayed-pages="7"></div>
                        </td>
                    </tr>
                    </tfoot>
                </table>
            </div>

        </div>
    </div>

    <script type="text/ng-template" id="ConfirmAccountDeleteCtrl.html">
    <div class="modal-header">
        <h3 class="modal-title">
            <div msg key='manage.account.deleteModal.title'></div>
        </h3>
    </div>
    <div class="modal-body">
        <p>

        <div msg key='manage.account.deleteModal.msg'></div>
        </p>
    </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-raised btn-raised btn-raised btn-primary" ng-click="cancel()"><span><i class="fa fa-times fa-fw">&nbsp; </i><span msg
                                                                                                                key='manage.account.deleteModal.cancelButton'></span></span>
        </button>
        <button class="btn btn-raised btn-raised btn-raised btn-danger" ng-click="delete()"><span><i class="fa fa-trash-o fa-fw">&nbsp; </i><span msg
                                                                                                                 key='manage.account.deleteModal.okButton'></span></span>
        </button>
    </div>
</script>

<script type="text/ng-template" id="EditAccountCtrl.html">
    <div class="modal-header">
        <h3 class="modal-title">
            <i class="fa fa-pencil"></i> Edit account: {{account.fullName}}
        </h3>
    </div>
    <div class="modal-body">
        <div ng-show="msg" class="alert" ng-class="{'alert-success': msg.type === 'success', 'alert-danger': msg.type === 'danger'}">
            {{msg.text}}
        </div>

        <div ng-form name="editAccountForm" class="form-horizontal" novalidate>
            <div class="form-group">
                <label class="control-label col-md-3" for="adminUsername">Username</label>
                <div class="col-md-8">
                    <input type="text" class="form-control account-input" name="adminUsername" id="adminUsername"
                           ng-model="account.username" ng-minlength="4" ng-maxlength="50" required>
                </div>
            </div>
            <div class="form-group">
                <label class="control-label col-md-3" for="adminEmail">Email</label>
                <div class="col-md-8">
                    <input type="email" class="form-control account-input" name="adminEmail" id="adminEmail"
                           ng-model="account.email" required>
                </div>
            </div>
            <div class="form-group" ng-class="{'has-success has-feedback': !passwordRequired() || editAccountForm.inputUserNewPassword.$valid, 'igl-has-error has-feedback': passwordRequired() && !editAccountForm.inputUserNewPassword.$valid}">
                <label class="control-label col-md-3" for="inputUserNewPassword">Password</label>
                <div class="col-md-8">
                    <input type="password" class="form-control immediate-help account-input" name="inputUserNewPassword" id="inputUserNewPassword" ng-model="accountpwd.newPassword" ng-minlength="8" ng-maxlength="20" ng-pattern="/(?=.*[a-z])(?=.*[A-Z])(?=.*[^a-zA-Z])/" ig-password-validate ng-required="passwordRequired()">
                    <div class="input-help">
                        <h4><div msg key='account.password.error'></div></h4>
                        <ul>
                            <li ng-class="pwdHasUpperCaseLetter"><div msg key='account.password.error.upperCaseletter'></div></li>
                            <li ng-class="pwdHasLowerCaseLetter"><div msg key='account.password.error.lowerCaseletter'></div></li>
                            <li ng-class="pwdHasNumber"><div msg key='account.password.error.number'></div></li>
                            <li ng-class="pwdValidLength"><div msg key='account.password.error.length'></div></li>
                        </ul>
                    </div>
                    <p class="help-block" ng-show="usernameChanged()">Required because the username is changing.</p>
                    <p class="help-block" ng-show="!usernameChanged()">Optional. Leave blank to keep the current password.</p>
                </div>
            </div>
            <div class="form-group" ng-class="{'has-success has-feedback': !passwordRequired() || editAccountForm.inputUserNewPasswordConfirm.$valid, 'igl-has-error has-feedback': passwordRequired() && !editAccountForm.inputUserNewPasswordConfirm.$valid}">
                <label class="control-label col-md-3" for="inputUserNewPasswordConfirm">Confirm password</label>
                <div class="col-md-8">
                    <input type="password" class="form-control immediate-help account-input" name="inputUserNewPasswordConfirm" id="inputUserNewPasswordConfirm" ng-model="accountpwd.newPasswordConfirm" ig-check-password="inputUserNewPassword" ng-required="passwordRequired()">
                    <div class="input-help">
                        <h4><div msg key='registration.passwordConfirm.error'></div></h4>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="col-md-offset-3 col-md-8">
                    <button class="btn btn-sm btn-raised btn-primary" ng-click="saveAccount()" ng-disabled="!editAccountForm.$valid">Save</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-sm btn-raised btn-default" ng-click="closeEditAccount()">
            <i class="fa fa-times"></i> Close
        </button>
    </div>
</script>
</div>
